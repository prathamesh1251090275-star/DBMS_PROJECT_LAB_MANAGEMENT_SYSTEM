<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab Equipment Management</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Login screen -->
  <section id="login-screen" class="login hidden">
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="brand-mark">LAB<span>/</span>EQ</div>
      <h1>College Lab Equipment</h1>
      <p class="muted">Sign in with your college account.</p>
      <label>Username <input name="username" required autocomplete="username"></label>
      <label>Password <input name="password" type="password" required autocomplete="current-password"></label>
      <div id="login-error" class="form-error" role="alert"></div>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </section>

  <!-- Main application -->
  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <div class="brand-mark">LAB<span>/</span>EQ</div>
      <nav id="nav"></nav>
      <div class="user-box">
        <div id="user-name" class="user-name"></div>
        <div id="user-role" class="muted small"></div>
        <button id="logout" class="btn ghost small">Log out</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button id="menu-btn" class="btn ghost menu-btn" aria-label="Menu">&#9776;</button>
        <h1 id="page-title"></h1>
      </header>
      <div id="view" aria-live="polite"></div>
    </main>
  </div>

  <dialog id="dlg"><form id="dlg-form" method="dialog"></form></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script src="js/app.js"></script>
</body>
</html>
